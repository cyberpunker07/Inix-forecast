<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<title>INIX FORECAST</title>
<style>
:root{--acc:#ffd54a;--accg:rgba(255,213,74,.45);--mute:rgba(255,255,255,.74);--glass:rgba(10,20,46,.38);--line:rgba(255,255,255,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0b1530;color:#fff;font-family:"Noto Sans Tamil","Noto Sans Devanagari","Nirmala UI",Latha,Mangal,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.shell{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 14px 140px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);box-shadow:0 8px 32px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.14)}
.head{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.loc{flex:1;display:flex;align-items:center;gap:6px;padding:0 14px;height:44px;border-radius:999px;min-width:0}
.loc select{flex:1;min-width:0;-webkit-appearance:none;appearance:none;border:0;background:transparent;color:#fff;font-weight:700;font-size:16px;height:100%;outline:none}
.loc select option{color:#111}
.src{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;padding:0 11px;height:34px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line)}
.src i{width:7px;height:7px;border-radius:50%;background:#ffb74d}
.src.live i{background:#5CFF9D;box-shadow:0 0 8px #5CFF9D;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.gear{position:relative;padding:0;line-height:0}
.gear svg{display:block;overflow:visible;position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px}
.gear.gd{color:#ffc83d;background:radial-gradient(circle at 50% 50%,rgba(255,200,61,.30),rgba(255,200,61,.06) 70%)!important;box-shadow:0 0 18px rgba(255,190,50,.45)}
.gear.gd svg{filter:drop-shadow(0 0 5px rgba(255,200,61,.9))}
.gear.gn{color:#e6edff;background:radial-gradient(circle at 50% 50%,rgba(160,180,255,.28),rgba(160,180,255,.05) 70%)!important;box-shadow:0 0 18px rgba(150,170,255,.40)}
.gear.gn svg{filter:drop-shadow(0 0 6px rgba(200,215,255,.85))}

.hero{text-align:center;padding:22px 0 6px;text-shadow:0 2px 24px rgba(0,0,0,.28)}
.hn{font-size:20px;font-weight:600;letter-spacing:.02em}
.ht{font-size:112px;font-weight:200;letter-spacing:-.05em;line-height:1;margin:2px 0;font-variant-numeric:tabular-nums}
.hc{font-size:19px;font-weight:600}
.hs{font-size:14px;color:var(--mute);margin-top:4px}
.eta{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:20px;margin-top:14px;text-align:left;font-weight:600;font-size:14px;color:#fff}
.eta span{flex:1}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--acc);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--accg)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.card{border-radius:24px;padding:14px;margin-top:12px}
.card h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:2px 0}
.hrs::-webkit-scrollbar{display:none}
.hc2{min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;font-size:13px}
.hc2 .rb{display:none}
.hc2:first-child{background:rgba(255,255,255,.14)}
.hc2 small{font-size:10.5px;color:var(--mute)}
.hc2 span{font-size:20px;line-height:1}
.rb{height:34px;width:6px;display:flex;align-items:flex-end;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.rb i{display:block;width:100%;background:linear-gradient(#9be7ff,#3aa7ff);border-radius:4px}
.day{display:grid;grid-template-columns:56px 28px 40px 36px 1fr 36px;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.day:last-child{border-bottom:0}
.day small{color:var(--mute)}
.track{height:6px;border-radius:6px;background:rgba(255,255,255,.16);position:relative}
.track i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#7fd1ff,var(--acc),#ff8a50)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.g2 .card{margin-top:0;min-height:138px}
.mv{font-size:34px;font-weight:300;letter-spacing:-.03em}
.sub{font-size:12.5px;color:var(--mute)}
.bar{height:6px;border-radius:6px;background:linear-gradient(90deg,#5CFF9D,#ffe066,#ff8a50,#ff4d6d);position:relative;margin-top:14px}
.bar i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #0b1530;transform:translateX(-50%)}
.pill{border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.l0{background:rgba(92,255,157,.25);color:#b8ffd3}.l1{background:rgba(255,224,102,.25);color:#fff0a6}.l2{background:rgba(255,150,80,.3);color:#ffd2b0}.l3{background:rgba(255,77,109,.35);color:#ffc2cc}
.ttl{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.ttl h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
.back{width:42px;height:42px;border-radius:50%;font-size:20px;color:#fff}
.pwr{margin:-6px 0 10px 2px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:#fff}
.chip.on{background:var(--acc);color:#101828;border-color:transparent;box-shadow:0 0 18px var(--accg)}
.mapbox{border-radius:24px;padding:6px;margin-top:8px}
#map{display:block;border-radius:18px}
.lgd{height:7px;border-radius:7px;margin:10px 4px 2px}
.lg{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);padding:0 4px}
.tl{font-size:30px;font-weight:300;letter-spacing:-.03em}
.play{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#101828;font-size:20px;box-shadow:0 0 22px var(--accg)}
.strip48{display:flex;align-items:flex-end;gap:2px;height:46px;margin:12px 0 0}
.strip48 i{flex:1;border-radius:2px;background:rgba(255,255,255,.22);min-height:3px}
.strip48 i.on{background:var(--acc);box-shadow:0 0 8px var(--accg)}
.strip48 i.rn{background:rgba(120,205,255,.7)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:2px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--acc),rgba(255,255,255,.28))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 0 14px var(--accg)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.big{font-size:46px;font-weight:300;letter-spacing:-.03em;line-height:1}
.bigem{font-size:52px;line-height:1}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border-bottom:1px solid var(--line);padding:11px 2px;text-align:left;color:#fff}
.li:last-child{border-bottom:0}
.tag{font-size:11.5px;background:rgba(255,255,255,.14);border-radius:999px;padding:2px 9px;margin-left:4px;white-space:nowrap}
.pday{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.pday:last-child{border-bottom:0}
.top2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meter{height:7px;border-radius:7px;background:rgba(255,255,255,.16);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#7fd1ff,var(--acc));border-radius:7px}
.note{font-size:12px;color:var(--mute);margin:12px 4px 0}
.btn{background:var(--acc);color:#101828;border-radius:999px;padding:10px 20px;font-weight:700;box-shadow:0 0 18px var(--accg)}
.log{height:44vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.msg{max-width:86%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;font-size:14.5px}
.me{align-self:flex-end;background:var(--acc);color:#101828;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:rgba(255,255,255,.13);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg small{display:block;margin-top:6px;font-size:11px;color:var(--mute)}
.typing{animation:blink 1.2s infinite}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:11px 16px;outline:none}
.ask input::placeholder{color:var(--mute)}
.ask button{background:var(--acc);color:#101828;border-radius:999px;padding:0 18px;font-weight:700}
.set{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}
.set:last-child{border-bottom:0}
.set input[data-act=geminikey]{min-width:0;flex:1 1 auto}
.set select{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.12);color:#fff;padding:8px;max-width:50%}
.set select option{color:#111}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:10;width:min(496px,calc(100% - 24px));display:flex;gap:4px;padding:8px 6px 6px;border-radius:28px;flex-wrap:wrap;justify-content:center;align-items:center}
.pageind{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 72px);z-index:11;display:flex;gap:10px;padding:6px 12px;background:rgba(10,20,46,.55);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(12px)}
.pageind i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .2s;flex:none}
.pageind i.on{background:var(--acc);box-shadow:0 0 10px var(--accg);width:24px;border-radius:5px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:22px;font-size:10.5px;font-weight:600;color:var(--mute);transition:background .2s}
.tab.on{color:#fff;background:rgba(255,255,255,.17);box-shadow:0 0 20px var(--accg)}
.tab.on svg{color:var(--acc)}
.enter .card,.enter .hero,.enter .eta,.enter .mapbox,.enter .chips{animation:rise .5s both}
.enter>:nth-child(3){animation-delay:.05s}.enter>:nth-child(4){animation-delay:.1s}.enter>:nth-child(5){animation-delay:.15s}.enter>:nth-child(6){animation-delay:.2s}.enter>:nth-child(7){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.loadwrap{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#001230;z-index:9999;overflow:hidden}
.logovid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#001230}
@media (min-aspect-ratio:3/4){.logovid{object-fit:contain}}
.loadbar{position:absolute;left:50%;bottom:calc(8% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(140px,40vw);height:4px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;z-index:2}
.loadbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.loadtxt{display:none}
.locwrap{flex:1;position:relative;min-width:0}
.locwrap .loc{width:100%}
.loc input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-weight:700;font-size:16px;height:100%;outline:none;-webkit-appearance:none;appearance:none}
.loc input::placeholder{color:var(--mute);font-weight:500}
.pres{position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:60vh;overflow:auto;border-radius:20px;padding:4px 14px 8px;background:rgba(10,20,46,.95);display:none;z-index:20}
.pres h5{margin:10px 2px 2px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function sysPrompt(){
const today=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const days=state.data[0].daily.time.map((t,k)=>"d"+k+"="+new Date(t+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})).join(", ");
const rows=D.map((d,i)=>{const o=state.data[i],y=o.daily,c=cyc(i);return d[0]+(d[3]?" [coastal]":"")+": now "+Math.round(o.cur.t)+"C, humidity "+Math.round(o.cur.h)+"%, wind "+Math.round(o.cur.wind)+" km/h, AQI "+(o.cur.aqi!=null?o.cur.aqi:"n/a")+", wind-risk "+LV[c.lvl]+" (max gust "+c.g+" km/h on d"+c.day+"), rain-timing: "+etaText(i,"en")+"; "+y.time.map((_,k)=>"d"+k+" "+Math.round(y.tmax[k])+"/"+Math.round(y.tmin[k])+"C rain "+y.pp[k]+"% "+y.ps[k].toFixed(1)+"mm gust "+Math.round(y.gust[k])).join("; ")}).join("\n");
const lang=state.lang==="hi"?"Hindi (Devanagari script)":state.lang==="ta"?"Tamil (Tamil script)":"English";
return "You are ENDER, the AI assistant built into INIX FORECAST, a weather app covering the 38 districts of Tamil Nadu, India, plus any place in the world the user searches for. If someone sincerely asks which AI model powers you, say you are powered by Google Gemini.\n"+
"Today is "+today+". The user's selected district is "+D[state.sel][0]+". Their temperature unit is °"+state.unit+" (the data below is in °C, so convert when they use °F). Rain is in mm and wind in km/h.\n"+
"You are a real, general-purpose AI assistant inside the app: answer ANY question the user asks, on any topic, like a normal chat assistant, and respond to greetings or small talk naturally without bringing up the weather unless they ask. For weather questions about Tamil Nadu, use the forecast data below and never invent weather numbers; if something is not covered (past weather, places not listed below, long-range outlooks), say so briefly.\n"+
"If the user names no district, use the selected one. Understand common aliases such as Trichy, Ooty, Kovai, Tuticorin and Nellai.\n"+
"Reply in the language the user writes in (including Tamil written in English letters); if that is unclear, use "+lang+".\n"+
"Be concise, warm, practical and helpful: lead with the clear answer, then add useful tips when relevant (umbrella, heat safety, travel timing, farm work, fishing, what to wear). Plain text only: no markdown, no asterisks, no headings. Keep answers short and clear (under about 150 words) unless the user asks for more detail.\n"+

"Days: "+days+"\nForecast per district (max/min temperature, rain probability, rain amount, max gust):\n"+rows}
async function askClaude(){

if(!key)throw "nokey";
const h=state.chat.filter(m=>!m.err).slice(-12).map(m=>({role:m.r==="me"?"user":"model",parts:[{text:m.t}]}));
while(h.length&&h[0].role!=="user")h.shift();
const body=JSON.stringify({systemInstruction:{parts:[{text:sysPrompt()}]},contents:h,generationConfig:{maxOutputTokens:2000}});
const models=["gemini-flash-latest","gemini-3.8-flash","gemini-3.5-flash-lite"];let last="fail";
for(const m of models){
const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},signal:ctl.signal,body});
if(r.ok){const j=await r.json();const t=(((j.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||"").join("").trim();if(t)return t;last="fail";continue}
let msg="";try{msg=((await r.json()).error||{}).message||""}catch(e){}
if(r.status===401||r.status===403||/api key/i.test(msg))throw "badkey";
last=r.status===429?"limit":"fail";if(r.status===404||r.status===400||r.status===429||r.status>=500)continue;throw last}
catch(e){if(e==="badkey"||e==="limit"||e==="fail"&&false)throw e;last=typeof e==="string"?e:"fail"}
finally{clearTimeout(to)}}
throw last}

if(loc.length)h+='<h5>'+L("Tamil Nadu & saved","तमिलनाडु और सहेजे गए","தமிழ்நாடு & சேமித்தவை")+'</h5>'+loc.map(i=>'<button class="li" data-pk="L'+i+'"><b>'+nm(i)+'</b><span class="tag">'+(i<NTN?L("District","ज़िला","மாவட்டம்"):L("Saved","सहेजा","சேமித்தது"))+'</span></button>').join("");
if(ps.res.length)h+='<h5>'+L("Worldwide","दुनिया भर","உலகம் முழுவதும்")+'</h5>'+ps.res.map((r,k)=>'<button class="li" data-pk="R'+k+'"><span><b>'+esc(r.name)+'</b><br><span class="sub">'+esc(r.sub)+'</span></span>'+(r.kind?'<span class="tag">'+r.kind+'</span>':'')+'</button>').join("");
if(!ps.res.length){if(loading)h+='<div class="sub" style="padding:10px 2px">'+L("Searching…","खोज रहे हैं…","தேடுகிறது…")+'</div>';else if(err)h+='<div class="sub" style="padding:10px 2px">'+L("Couldn't search. Check your internet connection.","खोज नहीं हो सकी। इंटरनेट जाँचें।","தேட முடியவில்லை. இணைய இணைப்பைச் சரிபார்க்கவும்.")+'</div>';else if(!h)h+='<div class="sub" style="padding:10px 2px">'+L("No places found","कोई जगह नहीं मिली","இடம் எதுவும் கிடைக்கவில்லை")+'</div>'}
box.innerHTML=h;box.style.display="block"}
async function fetchPlace(lat,lon){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
try{const b="latitude="+lat+"&longitude="+lon;
const [r,ra]=await Promise.all([fetch("https://api.open-meteo.com/v1/forecast?"+b+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7",{signal:ctl.signal}),fetch("https://air-quality-api.open-meteo.com/v1/air-quality?"+b+"&current=us_aqi,pm2_5,pm10&timezone=auto",{signal:ctl.signal})]);
if(!r.ok)throw 0;let o=await r.json();if(Array.isArray(o))o=o[0];let ja=null;try{if(ra.ok){ja=await ra.json();if(Array.isArray(ja))ja=ja[0]}}catch(e){}
const c=o.current,h=o.hourly,y=o.daily;let h0=h.time.indexOf(c.time.slice(0,13)+":00");if(h0<0)h0=0;const z=v=>v||0,ac=ja&&ja.current?ja.current:null;
return{cur:{t:c.temperature_2m,ft:c.apparent_temperature,h:c.relative_humidity_2m,code:c.weather_code,wind:c.wind_speed_10m,dir:c.wind_direction_10m,day:c.is_day,time:c.time,aqi:ac&&ac.us_aqi!=null?Math.round(ac.us_aqi):null,pm25:ac&&ac.pm2_5!=null?+(+ac.pm2_5).toFixed(1):null},h0,
hr:{time:h.time,t:h.temperature_2m,pp:h.precipitation_probability.map(z),ps:h.precipitation.map(z),code:h.weather_code,gust:h.wind_gusts_10m.map(z)},
daily:{time:y.time,code:y.weather_code,tmax:y.temperature_2m_max,tmin:y.temperature_2m_min,pp:y.precipitation_probability_max.map(z),ps:y.precipitation_sum.map(z),gust:y.wind_gusts_10m_max.map(z),sr:y.sunrise,ss:y.sunset,uv:y.uv_index_max.map(z)}}}
finally{clearTimeout(to)}}
async function addPlace(p){let i=D.findIndex((d,k)=>k>=NTN&&Math.abs(d[1]-p.lat)<.004&&Math.abs(d[2]-p.lon)<.004);if(i>=0)return i;
const data=await fetchPlace(p.lat,p.lon);
if(D.length-NTN>=8){D.splice(NTN,1);state.data.splice(NTN,1);const f=x=>x===NTN?CHENNAI:x>NTN?x-1:x;state.sel=f(state.sel);state.cmpA=f(state.cmpA);state.cmpB=f(state.cmpB)}
D.push([p.n,p.lat,p.lon,0]);state.data.push(data);
store.set("tn_places",JSON.stringify(D.slice(NTN).map(d=>({n:d[0],lat:d[1],lon:d[2]}))));return D.length-1}
async function pickPlace(r){const box=$("#pres");if(box)box.innerHTML='<div class="sub" style="padding:10px 2px">'+L("Loading forecast…","पूर्वानुमान लोड हो रहा है…","முன்னறிவிப்பு ஏற்றப்படுகிறது…")+'</div>';
try{const i=await addPlace({n:clean(r.label||r.name).slice(0,60)||"Place",lat:+(+r.latitude).toFixed(3),lon:+(+r.longitude).toFixed(3)});setSel(i);render()}
catch(e){if(box)box.innerHTML='<div class="sub" style="padding:10px 2px">'+L("Couldn't load that place. Check your internet and try again.","वह जगह लोड नहीं हो सकी। इंटरनेट जाँचकर फिर कोशिश करें।","அந்த இடத்தை ஏற்ற முடியவில்லை. இணையத்தைச் சரிபார்த்து மீண்டும் முயலவும்.")+'</div>'}}
const KIND={country:["Country","देश","நாடு"],state:["State","राज्य","மாநிலம்"],county:["District","ज़िला","மாவட்டம்"],city:["City","शहर","நகரம்"],district:["Area","इलाका","பகுதி"],locality:["Area","इलाका","பகுதி"],street:["Street","सड़क","தெரு"],house:["Address","पता","முகவரி"]};
const kindTag=t=>{const k=KIND[t];return k?L(k[0],k[1],k[2]):""};
async function geoPhoton(q){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
try{const r=await fetch("https://photon.komoot.io/api/?limit=10&q="+encodeURIComponent(q),{signal:ctl.signal});if(!r.ok)throw 0;const j=await r.json();const seen={},out=[];
for(const f of j.features||[]){const p=f.properties||{},c=f.geometry&&f.geometry.coordinates;if(!c||!isFinite(c[0])||!isFinite(c[1]))continue;
const st=p.street?p.street+(p.housenumber?" "+p.housenumber:""):"";const name=p.name||st||p.city||p.county||p.state||p.country;if(!name)continue;
const parts=[];for(const x of [p.name&&st?st:"",p.locality,p.district,p.city,p.county,p.state,p.country]){if(x&&x!==name&&parts.indexOf(x)<0)parts.push(x)}
const sub=parts.join(", ");const key=name+"|"+sub;if(seen[key])continue;seen[key]=1;
const near=p.city&&p.city!==name?p.city:p.county&&p.county!==name?p.county:p.state&&p.state!==name?p.state:"";
const label=[name,near,p.country&&p.country!==name?p.country:""].filter(Boolean).join(", ");
out.push({name:name,sub:sub,label:label,kind:kindTag(p.type),latitude:c[1],longitude:c[0]})}
return out}finally{clearTimeout(to)}}
async function geoMeteo(q){const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=8&language="+gcLang()+"&format=json");const j=await r.json();
return(j.results||[]).filter(x=>isFinite(x.latitude)&&isFinite(x.longitude)).map(x=>({name:x.name,sub:[x.admin2,x.admin1,x.country].filter(Boolean).join(", "),label:[x.name,x.admin1,x.country].filter(Boolean).join(", "),kind:"",latitude:x.latitude,longitude:x.longitude}))}
async function geoSearch(q){try{const a=await geoPhoton(q);if(a.length)return a}catch(e){}return geoMeteo(q)}
document.addEventListener("input",e=>{if(e.target.id!=="ps")return;const q=e.target.value.trim();clearTimeout(ps.t);const tok=++ps.tok;ps.res=[];
if(!q){const b=$("#pres");if(b)b.style.display="none";return}
showRes(q,q.length>=2);if(q.length<2)return;
ps.t=setTimeout(async()=>{try{const rs=await geoSearch(q);if(tok!==ps.tok)return;ps.res=rs;showRes(q,false)}catch(err){if(tok===ps.tok)showRes(q,false,1)}},400)});
document.addEventListener("focusin",e=>{if(e.target.id==="ps")e.target.select()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ps"&&!e.isComposing){const b=$("#pres [data-pk]");if(b)b.click();e.target.blur()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-pk]");
if(!b){if(!e.target.closest(".locwrap")){const x=$("#pres");if(x)x.style.display="none"}return}
const k=b.dataset.pk;if(k[0]==="L"){setSel(+k.slice(1));render();return}
const r=ps.res[+k.slice(1)];if(r)pickPlace(r)});
/* ---------- Swipe navigation between pages ---------- */
const TABS=["now","plan","aqi","ask"];
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{
  if(!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const i=TABS.indexOf(state.tab);
  if(i<0)return;
  if(dx<0&&i<TABS.length-1){state.tab=TABS[i+1];render()}
  else if(dx>0&&i>0){state.tab=TABS[i-1];render()}
},{passive:true});
skyInit();
setScene(sceneFor(0,new Date().getHours()>=6&&new Date().getHours()<18?1:0,12));
loadGeo();
load();
</script>
